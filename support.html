<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SupplyNow · Live Support</title>
<style>
  html,body{height:100%;margin:0}
  body{background:#0f1216;color:#e8edf3;display:flex;align-items:center;justify-content:center;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  .spin{width:34px;height:34px;border:3px solid #26303a;border-top-color:#4ce0c7;border-radius:50%;
    animation:s .8s linear infinite;margin:0 auto 16px}
  @keyframes s{to{transform:rotate(360deg)}}
  a{color:#4ce0c7}
</style>
</head>
<body>
<div id="box">
  <div class="spin"></div>
  <div>Connecting to Live Support…</div>
</div>
<script>
// Stable entry point: the Cart Labels "Live Support" button always opens THIS page.
// It fetches the current bot URL (kept fresh by the supervisor) and forwards — so
// tunnel-URL rotation and cached devices never break the button again.
(async function () {
  try {
    const r = await fetch('support_url.txt?cb=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('fetch ' + r.status);
    const url = (await r.text()).trim();
    if (/^https:\/\/[^\s]+$/.test(url)) {
      // cache-bust the chat so a device never serves a stale copy of it
      location.replace(url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now());
      return;
    }
    throw new Error('bad url');
  } catch (e) {
    document.getElementById('box').innerHTML =
      "Live Support is offline right now.<br><br>Please try again in a minute, or tell dispatch.";
  }
})();
</script>
</body>
</html>
