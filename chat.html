<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SupplyNow · Depot Assistant</title>
<style>
  :root{
    --bg:#0d1014; --bg2:#12171d; --card:#171e26; --line:#232c37; --ink:#eaf0f6; --mut:#93a1b2; --faint:#5f6c7b;
    --amber:#f4b53f; --amberink:#1a1206; --frost:#4ce0c7; --green:#37c26b; --amberw:#f4b53f; --red:#ef5b5b; --blue:#5b8cff;
    --me:linear-gradient(180deg,#f7c256,#f0ab2e);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#05070a}
  body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  .phone{max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
    background:radial-gradient(1200px 600px at 50% -10%, #141b23 0%, var(--bg) 60%);position:relative}

  header{padding:calc(14px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:11px;
    background:rgba(13,16,20,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20}
  .avatar{width:38px;height:38px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
    font-weight:800;font-size:14px;letter-spacing:.5px;color:#eafff9;
    background:linear-gradient(160deg,#1c6f63,#0f4a42);box-shadow:0 0 0 1px #ffffff12, 0 6px 16px #0008}
  .htxt{flex:1;min-width:0}
  .htitle{font-weight:700;font-size:15px;letter-spacing:.2px;white-space:nowrap}
  .hsub{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .dot.mock{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}
  .who{font-size:12px;color:var(--frost);font-weight:600;padding:6px 10px;border-radius:999px;flex:0 0 auto;
    background:#4ce0c714;border:1px solid #4ce0c733;cursor:pointer;white-space:nowrap;max-width:52%;overflow:hidden;text-overflow:ellipsis}
  .who:active{transform:scale(.96)}

  #log{flex:1;overflow-y:auto;padding:18px 14px 6px;display:flex;flex-direction:column;gap:9px;scroll-behavior:smooth}
  .row{display:flex;max-width:100%;animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
  .row.me{justify-content:flex-end}
  @keyframes rise{from{opacity:0;transform:translateY(9px) scale(.98)}to{opacity:1;transform:none}}
  .bubble{padding:10px 14px;border-radius:19px;max-width:80%;white-space:pre-wrap;word-break:break-word;
    box-shadow:0 1px 1px #0003;font-size:15px}
  .bot .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
  .me .bubble{background:var(--me);color:var(--amberink);font-weight:600;border-bottom-right-radius:6px}
  .stamp{font-size:11px;color:var(--faint);margin:-3px 6px 2px;align-self:flex-start}
  .me + .stamp{align-self:flex-end}

  /* typing */
  .typing .bubble{display:flex;gap:5px;align-items:center;padding:14px 16px}
  .typing i{width:8px;height:8px;border-radius:50%;background:var(--mut);opacity:.5;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:3px 2px 2px;animation:rise .34s both}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:999px;
    font-size:14px;font-weight:600;cursor:pointer;transition:.14s;display:flex;align-items:center;gap:7px}
  .chip:hover{border-color:var(--frost);color:var(--frost)}
  .chip:active{transform:scale(.95)}
  .chip.hot{background:var(--me);color:var(--amberink);border-color:transparent}
  .chip .k{font-size:16px}

  /* product card */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-top:6px;
    display:flex;gap:12px;align-items:flex-start;animation:rise .34s both;max-width:88%}
  .card .thumb{width:60px;height:60px;border-radius:11px;object-fit:contain;background:#fff;flex:0 0 auto}
  .card .body{min-width:0;flex:1}
  .card .nm{font-weight:700;font-size:14.5px;line-height:1.3}
  .card .meta{color:var(--mut);font-size:13px;margin-top:3px}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;margin-top:8px}
  .badge.in{background:#37c26b22;color:var(--green)} .badge.limited{background:#f4b53f22;color:var(--amber)}
  .badge.out{background:#ef5b5b22;color:var(--red)} .badge.unknown{background:#5f6c7b22;color:var(--mut)}
  .bin{margin-top:8px;font-weight:800;color:var(--frost);font-size:14px}
  .subhead{color:var(--faint);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin:12px 4px 2px}

  footer{padding:8px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
    background:rgba(13,16,20,.9);backdrop-filter:blur(14px);position:sticky;bottom:0}
  .quick{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 9px;scrollbar-width:none}
  .quick::-webkit-scrollbar{display:none}
  .quick .chip{flex:0 0 auto}
  .quick.hide{display:none}
  .inbar{display:flex;gap:9px;align-items:center}
  input[type=text]{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;
    padding:12px 16px;font-size:16px;outline:none;transition:.15s}
  input[type=text]:focus{border-color:var(--frost);background:var(--bg2)}
  .send{width:46px;height:46px;flex:0 0 auto;border:0;border-radius:50%;background:var(--me);color:var(--amberink);
    font-size:19px;cursor:pointer;display:grid;place-items:center;transition:.14s}
  .send:active{transform:scale(.9)}
  .send:disabled{opacity:.4}
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="avatar">SN</div>
    <div class="htxt">
      <div class="htitle">Depot Assistant</div>
      <div class="hsub"><span class="dot" id="dot"></span><span id="status">connecting…</span></div>
    </div>
    <div class="who" id="who" style="display:none"></div>
  </header>

  <div id="log"></div>

  <footer>
    <div class="quick hide" id="quick"></div>
    <div class="inbar">
      <input id="box" type="text" placeholder="Type your name to start…" autocomplete="off" autocapitalize="words">
      <button class="send" id="send" title="Send">↑</button>
    </div>
  </footer>
</div>

<script>
let API = new URLSearchParams(location.hash.slice(1)).get("api") || "";
const $ = s => document.querySelector(s);
const log = $("#log"), box = $("#box"), quick = $("#quick");

const INTENTS = [
  {key:"identify",     k:"🔎", label:"Item ID"},
  {key:"inventory",    k:"📦", label:"In stock?"},
  {key:"location",     k:"📍", label:"Bin"},
  {key:"substitution", k:"🔁", label:"Sub"},
];
const LABEL = Object.fromEntries(INTENTS.map(i=>[i.key,i]));

let S = { users:[], locations:[], mode:"", user:null, phase:"identify", intent:null, item:null, storeKey:"", storeLabel:"" };

/* ---------- rendering ---------- */
function el(t,c,h){const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function scroll(){ requestAnimationFrame(()=>{ log.scrollTop = log.scrollHeight; }); }

function me(t){ const r=el('div','row me'); r.append(el('div','bubble',esc(t))); log.append(r); scroll(); }
function bot(t){ return new Promise(res=>{ const r=el('div','row bot'); const b=el('div','bubble',esc(t)); r.append(b); log.append(r); scroll(); res(r); }); }

function typing(on){
  let t=$("#typing");
  if(on){ if(!t){ t=el('div','row bot typing'); t.id='typing'; t.append(el('div','bubble','<i></i><i></i><i></i>')); log.append(t); scroll(); } }
  else if(t) t.remove();
}
// bot message with a natural typing pause first — the iMessage feel
async function say(t, pause=520){ typing(true); await wait(pause); typing(false); await bot(t); }
const wait = ms => new Promise(r=>setTimeout(r,ms));

function chipRow(items, onPick, hotKeys){
  const wrap=el('div','chips');
  items.forEach(it=>{
    const c=el('button','chip'+(hotKeys&&hotKeys.includes(it.key)?' hot':''),
      (it.k?`<span class="k">${it.k}</span>`:'')+esc(it.label));
    c.onclick=()=>onPick(it); wrap.append(c);
  });
  const r=el('div','row bot'); r.append(wrap); log.append(r); scroll();
}

function badge(stock){
  const m={in:['in','✅ In stock'],limited:['limited','⚠️ Limited'],out:['out','⛔ Out'],unknown:['unknown','• Unknown']};
  const v=m[stock]||m.unknown; return `<span class="badge ${v[0]}">${v[1]}</span>`;
}
function card(p, opts={}){
  const c=el('div','card');
  if(p.image_url){ const img=el('img','thumb'); img.src=p.image_url; img.alt=p.name; img.onerror=()=>img.remove(); c.append(img); }
  const b=el('div','body');
  b.append(el('div','nm',(p.item_no?`#${esc(p.item_no)} · `:'')+esc(p.name||'')));
  const meta=[]; if(p.pack)meta.push(esc(p.pack)); if(p.price)meta.push('$'+esc(p.price));
  if(meta.length) b.append(el('div','meta',meta.join(' · ')));
  if(opts.stock && p.stock) b.insertAdjacentHTML('beforeend',badge(mapStock(p.stock)));
  if(opts.bin && p.bin) b.append(el('div','bin','📍 '+esc(p.bin)));
  c.append(b); const r=el('div','row bot'); r.append(c); log.append(r); scroll();
}
// engine sends in_stock/limited/out_of_stock; normalize to short codes for the badge
function mapStock(s){ return ({in_stock:'in',limited:'limited',out_of_stock:'out',in:'in',out:'out'})[s] || (s||'unknown'); }

function wipe(){ log.innerHTML=""; }  // fresh, focused thread per task

/* ---------- api ---------- */
async function api(path, body){
  const H={"ngrok-skip-browser-warning":"1"};
  const opts = body
    ? {method:"POST", headers:{"Content-Type":"application/json", ...H}, body:JSON.stringify(body)}
    : {headers:H};
  const r=await fetch(API+path, opts);
  return r.json();
}

/* ---------- identity ---------- */
function aliasList(u){ return (u.aliases||[]).map(a=>a.toLowerCase()); }
function matchUser(name){
  const q=name.trim().toLowerCase(); if(!q) return {none:true};
  let m=S.users.filter(u=>u.name.toLowerCase()===q || aliasList(u).includes(q) || u.key.toLowerCase()===q);
  if(m.length===1) return {user:m[0]};
  m=S.users.filter(u=>u.name.toLowerCase().split(/\s+/).includes(q)||u.name.toLowerCase().includes(q)
    ||aliasList(u).some(a=>a.includes(q)||a.split(/\s+/).includes(q)));
  if(m.length===1) return {user:m[0]};
  if(m.length>1) return {many:m};
  return {none:true};
}
function firstName(u){ return (u.name||'').split(/[\s,]+/)[0]; }

async function handleName(name){
  const r=matchUser(name);
  if(r.user){ await setUser(r.user); return; }
  if(r.many){
    await say(`A few of you go by “${name}” 👀 — which one?`, 400);
    chipRow(r.many.map(u=>({key:u.key,label:u.name})), u=>{ const usr=S.users.find(x=>x.key===u.key); pickedName(usr); });
    return;
  }
  await say(`I don't have that on the roster yet — what's your first and last name?`, 400);
}
function pickedName(u){ me(u.name); setUser(u); }

async function setUser(u){
  S.user=u; S.storeKey=""; S.storeLabel=""; localStorage.setItem('da_user',u.key);
  if(u.master){ return askLocation(true); }   // management → pick any location
  $("#who").style.display=''; $("#who").textContent=`${firstName(u)} · ${(u.store_label||'').replace(/^RD /,'')}`;
  $("#who").onclick=switchUser;
  toReady(`There you are, ${firstName(u)} 🙌  You're set on ${u.store_label}. What do you need?`);
}
function switchUser(){ localStorage.removeItem('da_user'); S.user=null; S.storeKey=""; $("#who").style.display='none'; startIdentity(); }

// master users choose a location (and can switch it any time via the who-pill)
async function askLocation(firstTime){
  wipe(); S.phase='pickLoc'; S.intent=null; S.item=null; setQuick(false); $("#who").style.display='none';
  box.placeholder="Tap a location above…";
  await say(firstTime ? `Welcome back, ${firstName(S.user)} 🙌  Which location do you want to look at?`
                      : `Which location, ${firstName(S.user)}?`, 380);
  const items=S.locations.map(l=>({key:l.key,label:l.label.replace(/^RD /,''),full:l.label}))
    .concat([{key:'__switch',label:`↩ Not ${firstName(S.user)}?`}]);
  chipRow(items, it=>{ if(it.key==='__switch') return switchUser(); chooseLocation(it); });
}
async function chooseLocation(l){
  S.storeKey=l.key; S.storeLabel=l.full||l.label;
  $("#who").style.display=''; $("#who").textContent=`${firstName(S.user)} · ${(S.storeLabel||'').replace(/^RD /,'')}`;
  $("#who").onclick=()=>askLocation(false);    // masters tap the pill to change location
  me(l.label);
  toReady(`You're on ${S.storeLabel} 📍  What do you need?`);
}

/* ---------- flow ---------- */
function setQuick(show){
  quick.classList.toggle('hide', !show);
  if(show){ quick.innerHTML=''; INTENTS.forEach(it=>{ const c=el('button','chip',`<span class="k">${it.k}</span>`+it.label); c.onclick=()=>chosenIntent(it.key); quick.append(c); }); }
}

async function startIdentity(){
  wipe(); S.phase='identify'; setQuick(false);
  box.placeholder="Your name…"; box.disabled=false;
  await say("Hello 👋 — who am I talking to?", 400);
  box.focus();
}
async function toReady(greet){
  wipe(); S.phase='ready'; S.intent=null; S.item=null; setQuick(true);
  box.placeholder="Ask me anything — item #, name, “bin for 8081”…";
  if(greet) await say(greet, 350);
  box.focus();
}

// user tapped a quick chip → new focused task, ask for the item
async function chosenIntent(intent){
  if(S.phase==='clarify' && S.item){ runTask(intent, S.item); return; }   // item already known
  wipe(); S.intent=intent; S.item=null; S.phase='awaitItem'; setQuick(false);
  const L=LABEL[intent];
  me(`${L.k} ${L.label}`);
  const prompt={
    identify:"Cool — which item? Drop a name or a #.",
    inventory:"On it 👍 which item should I check the shelf on?",
    location:"Which item — I'll grab its bin.",
    substitution:"Which item needs a backup?"
  }[intent];
  await say(prompt, 420); box.focus();
}

// free-text intent parsing
function parse(text){
  const t=' '+text.toLowerCase()+' ';
  let intent=null;
  if(/\b(bin|aisle|where|located|location|shelf)\b/.test(t)) intent='location';
  else if(/\b(sub|subs|substitut\w*|replac\w*|instead|alternat\w*|swap|backup)\b/.test(t)) intent='substitution';
  else if(/\b(in\s*stock|stock|have|available|inventory|on\s*hand|qty|quantity|got|out)\b/.test(t)) intent='inventory';
  else if(/\b(what\s*is|what'?s|identify|info|price|cost|picture|pic|id)\b/.test(t)) intent='identify';
  const item=text.replace(/\b(bin|aisle|where'?s?|located|location|shelf|subs?|substitut\w*|replac\w*|instead|alternat\w*|swap|backup|in\s*stock|stock|have|available|inventory|on\s*hand|qty|quantity|got|out|what'?s?\s*is|whats|identify|info|price|cost|picture|pic|id|for|of|the|a|is|are|any|do\s*we|we|got\s*any|at\s*my|my|store)\b/gi,' ')
    .replace(/[?.!]/g,' ').replace(/\s+/g,' ').trim();
  return {intent, item};
}

async function onFreeText(text){
  const {intent,item}=parse(text);
  if(intent && item){ runTask(intent,item); return; }
  if(intent && !item){ chosenIntent(intent); return; }     // "check stock" with no item
  if(!intent && item){                                     // item, but unclear what they want
    wipe(); me(text); S.item=item; S.phase='clarify'; setQuick(false);
    await say(`Got it — ${item}. What're we checking? 👇`, 420);
    chipRow(
      [{key:'inventory',k:'📦',label:'In stock?'},{key:'location',k:'📍',label:'Bin'},{key:'substitution',k:'🔁',label:'Sub'},{key:'identify',k:'🔎',label:'Item ID'}],
      it=>runTask(it.key, item), ['inventory']
    );
    return;
  }
  // nothing usable
  me(text);
  await say("Give me an item # or name — and whether you want stock, a bin, or a sub 🙂", 420);
}

async function runTask(intent, item){
  wipe(); S.phase='working'; setQuick(false);
  const L=LABEL[intent];
  me(`${L.k} ${item}`);
  const lead={inventory:"Checking the shelf…",location:"Finding the bin…",substitution:"Looking for a backup…",identify:"Pulling it up…"}[intent];
  await bot(lead);                 // warm "one sec" line
  typing(true); await wait(300);
  let res;
  try{ res=await api("/api/chat",{user_key:S.user.key,intent,text:item,store_key:S.storeKey}); }
  catch(e){ typing(false); await say("Lost the connection for a sec — try that again?"); return toReady(); }
  typing(false);
  if(res.need_identity){ return startIdentity(); }
  if(res.need_location){ return askLocation(false); }   // master hasn't picked a store
  await renderResult(intent,res);
  await whatsNext();
}

async function renderResult(intent,res){
  const p=(res.products||[])[0];
  if(!res.ok || !p){ await bot(res.text || "Couldn't find that one — check the #?"); return; }
  // a warm one-liner, then the card
  await bot(res.text);
  if(intent==='identify'){ (res.products||[]).slice(0,3).forEach(x=>card(x,{})); }
  else card(p,{stock:intent==='inventory', bin:intent==='location'});
  if((res.substitutes||[]).length){
    const sh=el('div','row bot'); sh.append(el('div','subhead','Backups in stock')); log.append(sh);
    res.substitutes.forEach(s=>card(s,{})); scroll();
  }
}

async function whatsNext(){
  S.phase='ready'; S.intent=null; S.item=null; setQuick(true);
  await say(`Anything else, ${firstName(S.user)}?`, 620);
  box.focus();
}

/* ---------- input ---------- */
async function submit(){
  const t=box.value.trim(); if(!t) return; box.value="";
  if(S.phase==='identify'){ me(t); return handleName(t); }
  if(S.phase==='awaitItem'){ return runTask(S.intent, t); }
  if(S.phase==='clarify'){                 // they typed instead of tapping — re-parse with the known item
    const {intent}=parse(t);
    if(intent) return runTask(intent, S.item);
    return runTask('inventory', t);        // default to stock
  }
  return onFreeText(t);
}
$("#send").onclick=submit;
box.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });

/* ---------- boot ---------- */
async function boot(){
  let health, roster, locs;
  try{ health=await api("/api/health"); roster=await api("/api/roster"); locs=await api("/api/locations"); }
  catch(e){ $("#status").textContent="engine offline"; $("#dot").className="dot off"; return; }
  S.mode=health.mode; S.users=roster.users||[]; S.locations=(locs&&locs.locations)||[];
  $("#status").textContent = health.mode==="mock" ? "demo mode" : "live · Restaurant Depot";
  if(health.mode==="mock") $("#dot").classList.add('mock');
  const saved=localStorage.getItem('da_user');
  const u=saved && S.users.find(x=>x.key===saved);
  if(u){ setUser(u); } else { startIdentity(); }
}
boot();
</script>
</body>
</html>
